<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144374"/>
      <stop offset="50%" stop-color="#0e325a"/>
      <stop offset="100%" stop-color="#081e38"/>
    </linearGradient>

    <!-- Hexagon 3D Shading Gradients -->
    <linearGradient id="hexWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2effa"/>
    </linearGradient>

    <linearGradient id="hexIce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff7fd"/>
      <stop offset="100%" stop-color="#cbe3f7"/>
    </linearGradient>

    <linearGradient id="hexBevel" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9fc7ea"/>
      <stop offset="100%" stop-color="#d4e8f9"/>
    </linearGradient>

    <linearGradient id="hexSubtle1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19548f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0e3561" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="hexSubtle2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5c9d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#12406f" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soft Drop Shadow for 3D Hexagons -->
    <filter id="hexShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="12" stdDeviation="14" flood-color="#040e1b" flood-opacity="0.45"/>
    </filter>
    <filter id="hexShadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="8" stdDeviation="10" flood-color="#051222" flood-opacity="0.35"/>
    </filter>

    <!-- Node Glow Filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Base Regular Pointy-Top Hexagon Path Symbol (Radius 70) -->
    <!-- Vertices: (0,-70), (60.62,-35), (60.62,35), (0,70), (-60.62,35), (-60.62,-35) -->
    <g id="hexPath">
      <polygon points="0,-70 60.62,-35 60.62,35 0,70 -60.62,35 -60.62,-35" />
    </g>

    <!-- Large 3D Hexagon Tile (Radius 120) with Beveled Edge -->
    <!-- Vertices: (0,-120), (103.92,-60), (103.92,60), (0,120), (-103.92,60), (-103.92,-60) -->
    <g id="tile3D-white">
      <!-- 3D bottom bevel -->
      <polygon points="-103.92,60 0,120 103.92,60 103.92,72 0,132 -103.92,72" fill="url(#hexBevel)" />
      <!-- Main Face -->
      <polygon points="0,-120 103.92,-60 103.92,60 0,120 -103.92,60 -103.92,-60" fill="url(#hexWhite)" />
    </g>

    <g id="tile3D-ice">
      <!-- 3D bottom bevel -->
      <polygon points="-103.92,60 0,120 103.92,60 103.92,70 0,130 -103.92,70" fill="url(#hexBevel)" />
      <!-- Main Face -->
      <polygon points="0,-120 103.92,-60 103.92,60 0,120 -103.92,60 -103.92,-60" fill="url(#hexIce)" />
    </g>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- ========================================== -->
  <!-- LAYER 1: Subtle Ambient Depth Hexagons     -->
  <!-- ========================================== -->
  <g fill="url(#hexSubtle1)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5">
    <use href="#hexPath" x="420" y="315" transform="scale(1.4)"/>
    <use href="#hexPath" x="280" y="680" transform="scale(1.2)"/>
    <use href="#hexPath" x="1560" y="420" transform="scale(1.3)"/>
    <use href="#hexPath" x="1420" y="780" transform="scale(1.5)"/>
    <use href="#hexPath" x="850" y="160" transform="scale(1.1)"/>
    <use href="#hexPath" x="1100" y="920" transform="scale(1.3)"/>
  </g>

